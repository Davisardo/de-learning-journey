version: 2

models:
  - name: stg_fact_transactions
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique
      - name: amount_bucket
        tests:
          - relationships:
              to: ref('stg_dim_amount')
              field: amount_bucket
      - name: fraud_class
        tests:
          - relationships:
              to: ref('stg_dim_fraud')
              field: fraud_class